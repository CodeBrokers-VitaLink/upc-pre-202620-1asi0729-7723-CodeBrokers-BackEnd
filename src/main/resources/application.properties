spring.application.name=vitalink-backend
spring.messages.fallback-to-system-locale=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
iam.jwt.secret-base64=${JWT_SECRET_BASE64}
iam.jwt.issuer=${JWT_ISSUER:vitalink}
iam.jwt.audience=${JWT_AUDIENCE:vitalink-api}
iam.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}
iam.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
iam.bootstrap.enabled=false
